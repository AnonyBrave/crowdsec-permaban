name: Build and publish the image (ghcr.io)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN is enough to publish to this repository's ghcr package, so no Personal Access Token is involved.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # ghcr package names must stay lowercase; replace this line when publishing a fork.
      IMAGE: ghcr.io/anonybrave/crowdsec-permaban
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (zero npm dependencies, nothing to install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A published image must come from a green suite: the tests run before any push to ghcr.
      - name: Test suite
        run: node --test tests/

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (workflow token)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish the image (private)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
