# Docker Compose stack — `docker compose up -d` on any host, or paste it into a compose UI (Dockge, Portainer).
services:
  crowdsec-permaban:
    # Private registry: the machine that pulls runs `docker login ghcr.io -u <login>` once (ghcr repos are private by
    # default, and the image name must stay lowercase). Build it with `docker build -t <the same name> .`.
    image: ghcr.io/AnonyBrave/crowdsec-permaban:latest
    container_name: crowdsec-permaban
    restart: unless-stopped
    ports:
      - "8780:8780"                    # one instance per port
    volumes:
      # The data folder: settings.json, credentials.enc + key.bin, events.ndjson, state.json.
      # A named volume is writable from the first launch: `/data` exists in the image owned by uid/gid 998, and Docker
      # copies that owner into a fresh volume. A bind-mounted folder needs `chown -R 998:998` on it once; an unwritable
      # mount gives a read-only store with a banner naming the mode, not a crash loop.
      - crowdsec-permaban-data:/data
    environment:
      # Seeded on the first run only; once `settings.json` exists these are ignored, and a Save in Settings writes the
      # credentials encrypted into the volume (`credentials.enc` + `key.bin`). Keep the two credential lines empty in any
      # compose file you share — enter them in Settings. Values can also live in `.env` as `${VAR}` references.
      PERMABAN_BASE_URL: "https://crowdsecwebui.example.com"    # your Web UI, nginx Basic-auth front end
      PERMABAN_USERNAME: ""
      PERMABAN_PASSWORD: ""
      PERMABAN_WEBHOOK_URL: ""          # ntfy-style topic URL for auto-ban / candidate pushes; empty = activity log only
      PERMABAN_POLL_SECONDS: "60"
      PERMABAN_PORT: "8780"
      PERMABAN_HOST: "0.0.0.0"
    healthcheck:
      # Same endpoint as the UI export links: process alive, store readable, last cycle's verdict.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8780/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
