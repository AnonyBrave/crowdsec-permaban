# Docker Compose stack — `docker compose up -d` on any host, or paste it into a compose UI (Dockge, Portainer).
# The image comes from GitHub Actions pushing to ghcr. A private package is pulled by the engine, not by compose: run
# `docker login ghcr.io -u youruser` once on the machine that pulls (token stored in the daemon's config.json), so no
# registry secret belongs in this file. Replace the image name with your own lowercase package before deploying a fork.
services:
  crowdsec-permaban:
    image: ghcr.io/anonybrave/crowdsec-permaban:latest
    container_name: crowdsec-permaban
    restart: unless-stopped
    ports:
      - "8780:8780"                    # one instance per port
    volumes:
      # The data folder: settings.json, credentials.enc + key.bin, events.ndjson, state.json.
      # The app runs as uid/gid 568 (`PUID`/`PGID`), so a bind-mounted folder needs `chown -R 568:568` on it once — skip
      # it if the ACL already grants 568, as shared app folders usually do; an unwritable mount gives a read-only store
      # with a banner naming the mode, not a crash loop.
      - /mnt/data/crowdsec-permaban:/data
    environment:
      PERMABAN_BASE_URL: "https://crowdsecwebui.example.com"    # your Web UI, nginx Basic-auth front end
      PERMABAN_USERNAME: ""
      PERMABAN_PASSWORD: ""
      PERMABAN_WEBHOOK_URL: ""          # ntfy-style topic URL for auto-ban / candidate pushes; empty = activity log only
      PERMABAN_POLL_SECONDS: "60"
      PERMABAN_PORT: "8780"
      PERMABAN_HOST: "0.0.0.0"
    healthcheck:
      # Same endpoint as the UI export links: process alive, store readable, last cycle's verdict.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8780/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
